name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd gateway && npm ci && npm run lint && npm test

  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd ai-engine && pip install -r requirements.txt pytest && python -m pytest tests/ -v

  streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd streaming && pip install -r requirements.txt pytest && python -m pytest tests/ -v

  biometrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd biometrics && pip install -r requirements.txt pytest && python -m pytest tests/ -v

# The `docker` job was removed. It ran `docker compose build` and had never once
# executed - it sat behind `needs: [gateway, ai-engine, streaming, biometrics]`
# and those jobs always failed first. When finally unblocked it failed building
# the ai-engine image: `basicsr>=1.4.2` errors during `setup.py egg_info` under
# current setuptools. basicsr is not dead weight - it is imported lazily in
# src/models/super_resolution.py inside _load_realesrgan(), the legacy
# Real-ESRGAN fallback - so it cannot simply be dropped from requirements.
# Re-add this job once that dependency is resolved or the legacy path is retired.
